services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_verify_only
      MYSQL_DATABASE: nisvartha_ci
      MYSQL_USER: nisvartha_ci
      MYSQL_PASSWORD: testpass
    ports:
      - '127.0.0.1:${NISVARTHA_VERIFY_DB_PORT:-33306}:3306'
    healthcheck:
      test: ['CMD-SHELL','mysqladmin ping -h 127.0.0.1 -uroot -proot_verify_only --silent']
      interval: 5s
      timeout: 5s
      retries: 30
