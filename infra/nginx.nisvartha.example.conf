# REFERENCE ONLY — do not enable until a verified domain, certificates,
# approved Foundation content/privacy policies and staging checks exist.
# The production API and Next.js app must bind to 127.0.0.1 only.
# Replace EVERY REPLACE_* token before using nginx -t.
server {
    listen 80;
    server_name REPLACE_WITH_APPROVED_FQDN;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name REPLACE_WITH_APPROVED_FQDN;

    ssl_certificate /etc/letsencrypt/live/REPLACE_WITH_APPROVED_FQDN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_APPROVED_FQDN/privkey.pem;
    server_tokens off;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # Enable HSTS only after checking HTTPS on the approved domain/subdomains.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Public API for read-only published content, readiness and gated forms.
    # Crucially: discard client-controlled forwarding lists. Backend trusts
    # ONLY this loopback proxy for rate-limit client IP attribution.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }

    # Next.js owns public routes and staff/member browser BFF.
    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }
}
