name: Lock Phase2 dependencies once
on:
  push:
    branches: [dev/phase2-cms-admin]
    paths: ['.github/workflows/lock-cms.yml']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix backend --package-lock-only --no-audit
      - name: Commit backend lockfile on feature branch only
        run: |
          git add backend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(cms): pin Argon2id dependency tree'
          git push origin HEAD:refs/heads/dev/phase2-cms-admin
