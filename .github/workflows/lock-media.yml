name: Pin Phase2 image transformer
on:
  push:
    branches: [dev/phase2-cms-admin]
    paths: ['.github/workflows/lock-media.yml']
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve only the declared pinned image dependency
        run: npm install --prefix backend --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated backend lockfile to feature branch
        run: |
          git add backend/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(media): reproducibly pin Sharp and native platform dependencies'
          git push origin HEAD:refs/heads/dev/phase2-cms-admin
