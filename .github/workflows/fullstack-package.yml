name: Full Stack Compiled Release Candidate
on:
  pull_request:
  push:
    branches:
      - feat/versioned-matrix-sandbox-policy-2026-11-05
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nisvartha-full-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fullstack_test_root
          MYSQL_DATABASE: nisvartha_ci
          MYSQL_USER: nisvartha_ci
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pfullstack_test_root"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://nisvarthafoundation.in
      NEXT_PUBLIC_API_URL: https://nisvarthafoundation.in
      API_INTERNAL_URL: http://127.0.0.1:3100
      PUBLIC_WEB_ORIGIN: https://nisvarthafoundation.in
      DATABASE_URL: mysql://nisvartha_ci:testpass@127.0.0.1:3306/nisvartha_ci
      PUBLIC_CONTENT_APPROVED: 'false'
      CMS_PUBLIC_CONTENT_ENABLED: 'false'
      NEXT_PUBLIC_FORMS_ENABLED: 'false'
      NEXT_PUBLIC_PRIVACY_APPROVED: 'false'
      FORM_SUBMISSIONS_ENABLED: 'false'
      PRIVACY_NOTICE_APPROVED: 'false'
      MEMBER_PORTAL_ENABLED: 'false'
      MEMBER_APPLICATIONS_ENABLED: 'false'
      MEMBER_STAFF_REGISTRATION_ENABLED: 'false'
      MEMBER_RECOVERY_ENABLED: 'false'
      REGISTRATION_ACCESS_PIN_ENABLED: 'false'
      MATRIX_PLACEMENT_ENABLED: 'false'
      MEMBER_COMPENSATION_ENABLED: 'false'
      NISVARTHA_UAT_PIN_REGISTRATION: 'false'
      NISVARTHA_UAT_PLAN: 'off'
      NISVARTHA_UAT_MEMBERS: 'off'
      NISVARTHA_UAT_PIN_FLOW: 'off'
      NISVARTHA_UAT_FORMS: 'off'
      NISVARTHA_CLIENT_TEMPLATE_PREVIEW: 'false'
      NISVARTHA_RELEASE_ARTIFACT: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Verify release safety and scope
        run: |
          node scripts/check-scope.mjs
          node scripts/test-release-preflight.mjs
          node scripts/test-local-uat.mjs
      - name: Install locked build dependencies
        run: |
          npm ci --prefix backend --no-audit --include=dev
          npm ci --prefix frontend --no-audit --include=dev
      - name: Compile, lint and typecheck
        run: |
          npm --prefix backend run verify
          npm --prefix frontend run verify
      - name: Stage locked production migration and bootstrap inputs
        run: |
          set -euo pipefail
          mkdir -p dist/fullstack/ops
          cp -a backend/prisma dist/fullstack/ops/prisma
          cp backend/package.json backend/package-lock.json dist/fullstack/ops/
          cp scripts/deploy-production-migrations.mjs dist/fullstack/ops/deploy-migrations.mjs
          cp scripts/release-profile.mjs dist/fullstack/ops/release-profile.mjs
          mkdir -p dist/fullstack/ops/systemd
          cp infra/systemd/nisvartha-{api,web}.service dist/fullstack/ops/systemd/
          cmp backend/prisma/schema.prisma dist/fullstack/ops/prisma/schema.prisma
          diff -qr backend/prisma/migrations dist/fullstack/ops/prisma/migrations
          node --check dist/fullstack/ops/deploy-migrations.mjs
      - name: Verify packaged migrations against real isolated MySQL
        run: |
          set -euo pipefail
          backend/node_modules/.bin/prisma migrate deploy --schema dist/fullstack/ops/prisma/schema.prisma
          backend/node_modules/.bin/prisma migrate status --schema dist/fullstack/ops/prisma/schema.prisma
          if NODE_ENV=production node dist/fullstack/ops/deploy-migrations.mjs; then
            echo 'Unsafe migration runner allowed an unapproved invocation' >&2
            exit 1
          fi
      - name: Prune backend development tools, retain Prisma generated client
        run: |
          npm prune --prefix backend --omit=dev --no-audit
          node -e 'const {PrismaClient}=require("./backend/node_modules/@prisma/client"); const p=new PrismaClient(); p.$disconnect()'
      - name: Stage only compiled runtime and traced dependencies
        run: |
          set -euo pipefail
          test -f backend/dist/main.js
          test -f frontend/.next/standalone/server.js
          mkdir -p dist/fullstack/api/dist dist/fullstack/web/.next dist/fullstack/web/public
          cp -a backend/dist/. dist/fullstack/api/dist/
          mkdir -p dist/fullstack/api/scripts
          cp backend/scripts/bootstrap-admin.mjs dist/fullstack/api/scripts/
          cp backend/package.json dist/fullstack/api/package.json
          cp -a backend/node_modules dist/fullstack/api/node_modules
          cp -a frontend/.next/standalone/. dist/fullstack/web/
          cp -a frontend/.next/static dist/fullstack/web/.next/static
          if test -d frontend/public; then cp -a frontend/public/. dist/fullstack/web/public/; fi
          test ! -e dist/fullstack/web/public/client-template
          migration_head="$(find backend/prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort | tail -1)"
          test -n "$migration_head"
          node scripts/release-profile.mjs create "$migration_head" > dist/fullstack/RELEASE_INFO.json
          node -e 'const r=require("./dist/fullstack/RELEASE_INFO.json");if(!r.build_env||r.origin!==process.env.NEXT_PUBLIC_SITE_URL)process.exit(1)'
      - name: Boot compiled package and smoke held routes
        run: node scripts/smoke-fullstack-artifact.mjs dist/fullstack
      - name: Create release tarball and checksum
        run: |
          set -euo pipefail
          name="nisvartha-fullstack-$GITHUB_SHA.tar.gz"
          tar -czf "dist/$name" -C dist/fullstack .
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "Full-stack release candidate: $name"
      - name: Upload runtime only; no application source
        uses: actions/upload-artifact@v4
        with:
          name: nisvartha-fullstack-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
