name: Full Stack Compiled Release Candidate
on:
  pull_request:
  push:
    branches:
      - feat/versioned-matrix-sandbox-policy-2026-11-05
      # Reviewed fixes can produce a real configured candidate on this
      # isolated branch without merging or changing main.
      - fix/member-route-navigation-gates-2026-11-10
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nisvartha-full-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # A PR builds held and synthetic review profiles. A push with genuine
      # membership/privacy identifiers builds TWO distinct immutable channels:
      # nonfinancial client-review and separately validated full financial
      # client-acceptance. Never relabel one as the other.
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["held","ci-review-test"]' || (vars.NISVARTHA_MEMBER_TERMS_VERSION != '' && vars.NISVARTHA_MEMBER_PRIVACY_VERSION != '' && '["held","client-review","client-acceptance"]' || '["held"]')) }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fullstack_test_root
          MYSQL_DATABASE: nisvartha_ci
          MYSQL_USER: nisvartha_ci
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pfullstack_test_root"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: production
      NISVARTHA_RELEASE_CHANNEL: ${{ matrix.profile }}
      NEXT_PUBLIC_SITE_URL: https://nisvarthafoundation.in
      NEXT_PUBLIC_API_URL: https://nisvarthafoundation.in
      API_INTERNAL_URL: http://127.0.0.1:3110
      PUBLIC_WEB_ORIGIN: https://nisvarthafoundation.in
      DATABASE_URL: mysql://nisvartha_ci:testpass@127.0.0.1:3306/nisvartha_ci
      PUBLIC_CONTENT_APPROVED: 'false'
      CMS_PUBLIC_CONTENT_ENABLED: 'false'
      NEXT_PUBLIC_FORMS_ENABLED: 'false'
      NEXT_PUBLIC_PRIVACY_APPROVED: 'false'
      FORM_SUBMISSIONS_ENABLED: 'false'
      PRIVACY_NOTICE_APPROVED: 'false'
      MEMBER_PORTAL_ENABLED: ${{ matrix.profile != 'held' && 'true' || 'false' }}
      MEMBER_APPLICATIONS_ENABLED: ${{ matrix.profile != 'held' && 'true' || 'false' }}
      MEMBER_STAFF_REGISTRATION_ENABLED: ${{ matrix.profile != 'held' && 'true' || 'false' }}
      MEMBER_RECOVERY_ENABLED: 'false'
      REGISTRATION_ACCESS_PIN_ENABLED: ${{ matrix.profile != 'held' && 'true' || 'false' }}
      MEMBER_PIN_AUTO_ACTIVATE_ENABLED: ${{ matrix.profile != 'held' && 'true' || 'false' }}
      MATRIX_PLACEMENT_ENABLED: ${{ matrix.profile != 'held' && 'true' || 'false' }}
      DONATION_ACCOUNTING_ENABLED: ${{ matrix.profile != 'held' && 'true' || 'false' }}
      MEMBER_COMPENSATION_ENABLED: ${{ matrix.profile == 'client-acceptance' && 'true' || 'false' }}
      MEMBER_WALLET_ENABLED: ${{ matrix.profile != 'held' && 'true' || 'false' }}
      MEMBER_COMPENSATION_APPROVED: ${{ matrix.profile == 'client-acceptance' && 'true' || 'false' }}
      PAID_PIN_ISSUANCE_ENABLED: ${{ matrix.profile == 'client-acceptance' && 'true' || 'false' }}
      PAID_PIN_ACCOUNTING_APPROVED: ${{ matrix.profile == 'client-acceptance' && 'true' || 'false' }}
      MEMBER_TERMS_VERSION: ${{ matrix.profile == 'ci-review-test' && 'ci-review-test-terms-v1' || vars.NISVARTHA_MEMBER_TERMS_VERSION || '' }}
      MEMBER_PRIVACY_VERSION: ${{ matrix.profile == 'ci-review-test' && 'ci-review-test-privacy-v1' || vars.NISVARTHA_MEMBER_PRIVACY_VERSION || '' }}
      NISVARTHA_UAT_PIN_REGISTRATION: 'false'
      NISVARTHA_UAT_PLAN: 'off'
      NISVARTHA_UAT_MEMBERS: 'off'
      NISVARTHA_UAT_PIN_FLOW: 'off'
      NISVARTHA_UAT_FORMS: 'off'
      NISVARTHA_CLIENT_TEMPLATE_PREVIEW: 'false'
      NISVARTHA_RELEASE_ARTIFACT: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Validate build profile and initialize CI-only PIN vault key
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.profile }}" != held ]]; then
            if [[ "${{ matrix.profile }}" == client-acceptance ]]; then
              [[ "$MEMBER_COMPENSATION_ENABLED" == true && "$MEMBER_COMPENSATION_APPROVED" == true &&
                 "$PAID_PIN_ISSUANCE_ENABLED" == true && "$PAID_PIN_ACCOUNTING_APPROVED" == true ]] ||
                { echo 'Full financial client acceptance requires all four financial gates' >&2; exit 1; }
            else
              [[ "$MEMBER_COMPENSATION_ENABLED" == false && "$MEMBER_COMPENSATION_APPROVED" == false &&
                 "$PAID_PIN_ISSUANCE_ENABLED" == false && "$PAID_PIN_ACCOUNTING_APPROVED" == false ]] ||
                { echo 'Client review must never enable financial compensation' >&2; exit 1; }
            fi
            for version in "$MEMBER_TERMS_VERSION" "$MEMBER_PRIVACY_VERSION"; do
              [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$ ]] ||
                { echo 'Client review requires explicit valid membership/privacy policy version IDs' >&2; exit 1; }
            done
            node -e 'const c=require("node:crypto");require("node:fs").appendFileSync(process.env.GITHUB_ENV,"PIN_VAULT_KEY="+c.randomBytes(32).toString("base64url")+"\n")'
            node scripts/release-preflight.mjs web
          fi
          if [[ "${{ matrix.profile }}" == client-review || "${{ matrix.profile }}" == client-acceptance ]]; then
            # A build-only test identity or draft policy is never publishable.
            for version in "$MEMBER_TERMS_VERSION" "$MEMBER_PRIVACY_VERSION"; do
              if [[ "$version" =~ (^|[._-])(ci|test|demo|sample|draft|preview)([._-]|$) ]]; then
                echo 'Published client policy identifiers must not be test or draft versions' >&2
                exit 1
              fi
            done
          fi
      - name: Verify release safety and scope
        run: |
          node scripts/test-project-delivery-contract.mjs
          node scripts/test-release-profile.mjs
          node scripts/check-scope.mjs
          node scripts/test-release-preflight.mjs
          node scripts/test-local-uat.mjs
          node scripts/test-compiled-deploy-contract.mjs
          node scripts/test-release-migrations.mjs
      - name: Install locked build dependencies
        run: |
          npm ci --prefix backend --no-audit --include=dev
          npm ci --prefix frontend --no-audit --include=dev
      - name: Audit runtime dependency graph
        run: |
          node scripts/audit-runtime-dependencies.mjs
          npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Compile, lint and typecheck
        run: |
          npm --prefix backend run verify
          npm --prefix frontend run verify
      - name: Stage locked production migration and bootstrap inputs
        run: |
          set -euo pipefail
          mkdir -p dist/fullstack/ops
          cp -a backend/prisma dist/fullstack/ops/prisma
          cp backend/package.json backend/package-lock.json dist/fullstack/ops/
          cp scripts/deploy-production-migrations.mjs dist/fullstack/ops/deploy-migrations.mjs
          cp scripts/release-profile.mjs dist/fullstack/ops/release-profile.mjs
          cp scripts/release-preflight.mjs dist/fullstack/ops/release-preflight.mjs
          cp scripts/prepare-release-env.mjs dist/fullstack/ops/prepare-release-env.mjs
          cp scripts/smoke-staged-artifact.mjs dist/fullstack/ops/smoke-staged-artifact.mjs
          cp scripts/check-release-migrations.mjs dist/fullstack/ops/check-release-migrations.mjs
          cp scripts/check-unused-database.mjs dist/fullstack/ops/check-unused-database.mjs
          cp scripts/audit-production-readiness.mjs dist/fullstack/ops/audit-production-readiness.mjs
          mkdir -p dist/fullstack/ops/systemd
          cp infra/systemd/nisvartha-{api,web}.service dist/fullstack/ops/systemd/
          cmp backend/prisma/schema.prisma dist/fullstack/ops/prisma/schema.prisma
          diff -qr backend/prisma/migrations dist/fullstack/ops/prisma/migrations
          node --check dist/fullstack/ops/deploy-migrations.mjs
          node --check dist/fullstack/ops/prepare-release-env.mjs
          node --check dist/fullstack/ops/smoke-staged-artifact.mjs
          node --check dist/fullstack/ops/check-release-migrations.mjs
          node --check dist/fullstack/ops/check-unused-database.mjs
          node --check dist/fullstack/ops/audit-production-readiness.mjs
      - name: Verify packaged migrations against real isolated MySQL
        run: |
          set -euo pipefail
          backend/node_modules/.bin/prisma migrate deploy --schema dist/fullstack/ops/prisma/schema.prisma
          backend/node_modules/.bin/prisma migrate status --schema dist/fullstack/ops/prisma/schema.prisma
          node scripts/test-member-code-inventory-mysql.mjs
          if NODE_ENV=production node dist/fullstack/ops/deploy-migrations.mjs; then
            echo 'Unsafe migration runner allowed an unapproved invocation' >&2
            exit 1
          fi
      - name: Prune backend development tools, retain Prisma generated client
        run: |
          npm prune --prefix backend --omit=dev --no-audit
          node scripts/prune-backend-runtime.mjs
          test ! -e backend/node_modules/prisma
          node -e 'const {PrismaClient}=require("./backend/node_modules/@prisma/client"); const p=new PrismaClient(); p.$disconnect()'
      - name: Stage only compiled runtime and traced dependencies
        run: |
          set -euo pipefail
          test -f backend/dist/main.js
          test -f frontend/.next/standalone/server.js
          mkdir -p dist/fullstack/api/dist dist/fullstack/web/.next dist/fullstack/web/public
          cp -a backend/dist/. dist/fullstack/api/dist/
          mkdir -p dist/fullstack/api/scripts
          cp backend/scripts/bootstrap-admin.mjs dist/fullstack/api/scripts/
          cp backend/package.json dist/fullstack/api/package.json
          cp -a backend/node_modules dist/fullstack/api/node_modules
          cp -a frontend/.next/standalone/. dist/fullstack/web/
          cp -a frontend/.next/static dist/fullstack/web/.next/static
          if test -d frontend/public; then cp -a frontend/public/. dist/fullstack/web/public/; fi
          test ! -e dist/fullstack/web/public/client-template
          migration_head="$(find backend/prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort | tail -1)"
          test -n "$migration_head"
          node scripts/release-profile.mjs create "$migration_head" > dist/fullstack/RELEASE_INFO.json
          node -e 'const r=require("./dist/fullstack/RELEASE_INFO.json");if(!r.build_env||r.origin!==process.env.NEXT_PUBLIC_SITE_URL)process.exit(1)'
      - name: Verify genuinely unused MySQL database shortcut using packaged Prisma
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import {createRequire} from 'node:module';
          import {inspectUnusedDatabase} from './dist/fullstack/ops/check-unused-database.mjs';
          const require=createRequire(new URL('./dist/fullstack/api/package.json',import.meta.url));
          const {Prisma,PrismaClient}=require('@prisma/client');
          const db=new PrismaClient();
          try{
           const problems=await inspectUnusedDatabase(db,Prisma.dmmf.datamodel.models);
           if(problems.length)throw Error('Isolated CI DB is not unused: '+problems.join('; '));
           console.log('Packaged unused-DB inspection on real MySQL: PASS');
          }finally{await db.$disconnect()}
          NODE
      - name: Boot exact compiled profile on isolated MySQL and exercise end-to-end acceptance
        shell: bash
        run: |
          if [[ "${{ matrix.profile }}" == client-acceptance ]]; then
            node scripts/smoke-compiled-financial-acceptance.mjs dist/fullstack
          else
            node scripts/smoke-fullstack-artifact.mjs dist/fullstack
          fi
      - name: Prove packaged 0024 to 0036 forward migration readiness on real MySQL
        shell: bash
        run: |
          set -euo pipefail
          prior="$(mktemp -d)"
          trap 'rm -rf "$prior"' EXIT
          printf '{"migration_head":"0024_member_wallet_payout_requests"}\n' > "$prior/RELEASE_INFO.json"
          node dist/fullstack/ops/check-release-migrations.mjs dist/fullstack "$prior"
      - name: Create release tarball and checksum
        run: |
          set -euo pipefail
          name="nisvartha-fullstack-$GITHUB_SHA-${{ matrix.profile }}.tar.gz"
          tar -czf "dist/$name" -C dist/fullstack .
          (cd dist && sha256sum "$name" > "$name.sha256")
          install -m 700 scripts/deploy-compiled-apache.sh dist/deploy-compiled-apache.sh
          echo "Full-stack release candidate: $name"
      - name: Upload runtime only; no application source
        uses: actions/upload-artifact@v4
        with:
          name: nisvartha-fullstack-${{ github.sha }}-${{ matrix.profile }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/deploy-compiled-apache.sh
          if-no-files-found: error
          retention-days: 14
