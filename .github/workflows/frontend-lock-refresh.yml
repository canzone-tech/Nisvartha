name: Temporary frontend lock refresh
on:
  pull_request:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Regenerate reviewed frontend dependency lock
        run: |
          npm install --prefix frontend --save-exact next@16.4.5
          npm install --prefix frontend --save-dev --save-exact eslint-config-next@16.4.5
          npm audit --prefix frontend --omit=dev --audit-level=high
      - name: Commit deterministic reviewed manifests
        run: |
          git config user.name 'canzone-tech'
          git config user.email 'shivi.shukla.tanya@gmail.com'
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --check
          git commit -m 'fix(deps): patch Next.js production vulnerabilities'
          git push origin HEAD:hardening/production-readiness-2026-11-08
