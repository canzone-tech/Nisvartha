name: Temporary dependency lock refresh
# one-shot lock generation; remove after commit
on:
  pull_request:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Regenerate reviewed backend dependency lock
        run: |
          npm pkg set 'overrides.multer=2.5.0' --prefix backend
          npm install --prefix backend --save-exact \
            @nestjs/common@11.2.8 @nestjs/core@11.2.8 @nestjs/platform-express@11.2.8 sharp@0.35.5
          npm ci --prefix backend --no-audit
          # Lock generation is separate from the repository's runtime audit gate.
          # Prisma CLI is a controlled migration tool and is classified separately.
          npm audit --prefix backend --omit=dev --audit-level=high || true
      - name: Commit deterministic reviewed manifests
        run: |
          git config user.name 'canzone-tech'
          git config user.email 'shivi.shukla.tanya@gmail.com'
          git add backend/package.json backend/package-lock.json
          git diff --cached --check
          git commit -m 'fix(deps): patch production backend vulnerabilities'
          git push origin HEAD:hardening/production-readiness-2026-11-08
