name: API CI
concurrency:
  group: nisvartha-api-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [dev/phase1-public-website, dev/phase2-cms-admin, dev/phase3-membership-foundation, dev/phase3-member-recovery]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: nisvartha_ci
          MYSQL_USER: nisvartha_ci
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptestroot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql://nisvartha_ci:testpass@127.0.0.1:3306/nisvartha_ci
      PUBLIC_WEB_ORIGIN: http://127.0.0.1:3102
      MEDIA_STORAGE_ROOT: /tmp/nisvartha-private-media-${{ github.run_id }}
      MEDIA_SCANNER_BIN: /tmp/nisvartha-private-media-scanner-${{ github.run_id }}.sh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate disposable E-PIN visibility key for MySQL regression
        run: |
          echo "PIN_VAULT_KEY=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')" >> "$GITHUB_ENV"
      - name: Install backend
        run: npm ci --prefix backend --no-audit
      - name: Run SRS and paid E-PIN HOLD scope gate
        run: node scripts/check-scope.mjs
      - name: Verify release preflight and read-only deployed-smoke negative fixtures
        run: |
          node scripts/test-release-preflight.mjs
          node scripts/test-release-smoke.mjs
          node scripts/test-local-uat.mjs
      - name: Validate, generate, typecheck, build
        run: npm --prefix backend run verify
      - name: Verify bounded, privacy-safe direct-invitation genealogy
        run: node scripts/test-genealogy-boundaries.mjs
      - name: Verify source-aligned nonfinancial 1:3 matrix and rebirth sandbox
        run: node scripts/test-matrix-sandbox.mjs
      - name: Verify complete synthetic referral totals beyond paged history
        run: node scripts/test-uat-scenario-totals.mjs
      - name: Verify reusable opaque credential cryptography and recovery hash parity
        run: node scripts/test-opaque-credential.mjs
      - name: Verify authenticated PIN vault encryption, tamper detection and key isolation
        run: node scripts/test-pin-vault.mjs
      - name: Test MEGA-aligned E-PIN batch candidate security contract
        run: node scripts/test-epin-batch.mjs
      - name: Verify non-issuing local E-PIN candidate CLI boundaries
        run: node scripts/test-uat-epin-candidates.mjs
      - name: Test read-only MEGA E-PIN redemption preconditions
        run: node scripts/test-epin-redemption-preconditions.mjs
      - name: Verify canonical purpose-separated E-PIN bearer digests and replay metadata
        run: node scripts/test-epin-bearer-verification.mjs
      - name: Apply initial migration to isolated MySQL
        run: npm --prefix backend run prisma:migrate
      - name: Exercise compiled API and real DB
        run: node scripts/smoke-api.mjs
      - name: Verify single Admin offline donation register on isolated MySQL
        run: node scripts/smoke-donations.mjs
      - name: Verify production loopback proxy per-client throttling on compiled API
        run: node scripts/smoke-proxy-throttle.mjs
      - name: Prepare isolated private local media scanner contract
        run: install -m 700 scripts/ci-media-scanner.sh "$MEDIA_SCANNER_BIN"
      - name: Verify private media, Admin approval and gallery access
        run: node scripts/smoke-media.mjs
      - name: Reconcile authoritative media records and isolated local disk
        run: node scripts/reconcile-media.mjs
      - name: Test staff auth, CMS review and audit on real MySQL
        run: node scripts/smoke-cms.mjs
      - name: Verify one-Admin bootstrap and deny-by-default account API
        run: node scripts/smoke-admin-only-rbac.mjs
      - name: Verify nonfinancial member application and revocable sessions
        run: node scripts/smoke-members.mjs
      - name: Verify synthetic one-time PIN and nonfinancial inviter transactional flow
        run: node scripts/smoke-uat-signup.mjs
      - name: Verify production-like no-fee Admin registration PIN lifecycle on real MySQL
        run: node scripts/smoke-registration-pins.mjs
      - name: Verify single root, E-PIN instant activation, referral login and concurrency on MySQL
        run: node scripts/smoke-pin-auto-active.mjs
      - name: Verify offline sale activation, earnings, five levels, rebirth and settlement
        run: node scripts/smoke-member-compensation.mjs
      - name: Verify payout reservation, Admin evidence and concurrent wallet integrity on MySQL
        run: node scripts/smoke-member-wallet.mjs
      - name: Verify E-PIN auto-activation, offline sale evidence, commission and wallet as one journey
        run: node scripts/smoke-verified-sale-wallet-integration.mjs
      - name: Verify deterministic member review pagination on real MySQL
        run: node scripts/smoke-member-review-pagination.mjs
      - name: Verify one-time identity-assisted member password recovery
        run: node scripts/smoke-member-recovery.mjs
      - name: Verify role-gated enquiry cases and approved retention
        run: node scripts/test-enquiry-cases.mjs
      - name: Verify full synthetic referral totals and privacy on real MySQL
        run: node scripts/test-uat-scenario-totals-db.mjs
      - name: Verify immutable sandbox revisions, same-Admin review, replay and MySQL concurrency
        run: node scripts/test-sandbox-policy-revisions.mjs
      - name: Verify volunteer input contract
        run: node scripts/test-volunteer.mjs
      - name: Verify fake-only local enquiry consent, replay and environment isolation
        run: node scripts/test-synthetic-enquiry-uat.mjs
      - name: Provision synthetic SELECT-only operator
        env:
          VERIFY_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -e MYSQL_PWD=testroot "$VERIFY_MYSQL_CONTAINER" mysql -uroot -e "CREATE USER 'nisvartha_operator'@'%' IDENTIFIED BY 'testreadonly'; GRANT SELECT ON nisvartha_ci.enquiries TO 'nisvartha_operator'@'%';"
      - name: Exercise authorized operator read-only view
        env:
          NISVARTHA_OPERATOR_DATABASE_URL: mysql://nisvartha_operator:testreadonly@127.0.0.1:3306/nisvartha_ci
        run: node scripts/smoke-operator.mjs
      - name: Compile frontend for full-stack CMS UAT
        run: |
          npm ci --prefix frontend --no-audit
          npm --prefix frontend run verify
      - name: Verify CMS published pages on compiled Next.js
        run: node scripts/smoke-cms-public.mjs
      - name: Verify compiled member application browser BFF
        run: node scripts/smoke-member-web.mjs
      - name: Verify synthetic public and staff PIN signup on compiled Next.js
        run: node scripts/smoke-uat-signup-web.mjs
      - name: Verify nonfinancial Admin PIN issuance and public/staff registration on compiled Next.js
        run: node scripts/smoke-registration-pin-web.mjs
      - name: Verify isolated MySQL backup and restore
        env:
          VERIFY_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          VERIFY_MYSQL_ROOT_PASSWORD: testroot
        run: node scripts/smoke-backup.mjs
      - name: Boot disposable local-UAT stack through real launcher (one-shot)
        timeout-minutes: 10
        env:
          NISVARTHA_UAT_ONESHOT: 'true'
        run: bash scripts/local-uat.sh
      - name: Boot entire synthetic public/member/E-PIN and referral UAT stack together
        timeout-minutes: 10
        env:
          NISVARTHA_UAT_ONESHOT: 'true'
          NISVARTHA_UAT_FORMS: synthetic
          NISVARTHA_UAT_MEMBERS: synthetic
          NISVARTHA_UAT_PIN_FLOW: synthetic
          NISVARTHA_UAT_PLAN: synthetic
        run: bash scripts/local-uat.sh
