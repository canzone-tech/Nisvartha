name: Web CI
concurrency:
  group: nisvartha-web-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [dev/phase1-public-website]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend --no-audit
      - run: node scripts/check-scope.mjs
      - run: npm --prefix frontend run verify
      - run: node scripts/smoke-web.mjs
      - run: node scripts/smoke-browser.mjs
