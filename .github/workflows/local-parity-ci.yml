name: Local Parity CI
concurrency:
  group: nisvartha-local-parity-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run exact Docker-backed local verification entrypoint
        run: npm run verify
